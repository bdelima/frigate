name: Auto-build and publish Panther Lake Frigate image

on:
  schedule:
    # Daily at 06:00 UTC. Adjust if you want faster pickup of new Frigate
    # releases — GitHub's minimum interval for scheduled workflows is
    # effectively ~5 min but anything under an hour is wasteful here.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream Frigate tag to build against (e.g. v0.18.1). Leave blank to auto-pick the latest stable release."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free up disk space
        # Frigate's build is large (ML deps, multiple hardware-accel
        # backends); the default GitHub-hosted runner's ~14GB free is
        # tight. Remove preinstalled toolchains this build doesn't need.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true

      - name: Checkout this fork (full history, all branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine target tag
        id: pick_tag
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            git remote add upstream https://github.com/blakeblackshear/frigate.git 2>/dev/null || true
            git fetch upstream --tags --force
            # Stable releases only (no -rc/-beta) — matches "v0.1*" style
            # tags, sorted by version, latest wins.
            TAG=$(git tag -l 'v0.1*' | grep -vE '(rc|beta)' | sort -V | tail -1)
          fi
          [[ -n "$TAG" ]] || { echo "::error::Could not determine a target tag"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target tag: $TAG"

      - name: Check whether this tag is already published
        id: check_published
        run: |
          VERSION="${{ steps.pick_tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/bdelima/frigate-panther-lake/tags/${VERSION}")
          if [[ "$STATUS" == "200" ]]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "${VERSION} already exists on Docker Hub — nothing to do."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check_published.outputs.already_published == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build (merge + patch + make local)
        if: steps.check_published.outputs.already_published == 'false'
        run: |
          chmod +x scripts/build.sh
          scripts/build.sh "${{ steps.pick_tag.outputs.tag }}" --push-on-conflict
        # A merge conflict makes build.sh exit 2, a real error exits 1 —
        # either way this step (and the job) fails, which is exactly the
        # desired behavior ("CI fails clean, resolve locally, re-trigger").
        # The step-summary step below still runs because it has
        # `if: always()`.

      - name: Log in to Docker Hub
        if: steps.check_published.outputs.already_published == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: steps.check_published.outputs.already_published == 'false'
        run: |
          docker tag "${IMAGE_TAG}" "bdelima/frigate-panther-lake:${VERSION}"
          docker tag "${IMAGE_TAG}" "bdelima/frigate-panther-lake:latest"
          docker push "bdelima/frigate-panther-lake:${VERSION}"
          docker push "bdelima/frigate-panther-lake:latest"

      - name: Create GitHub Release
        if: steps.check_published.outputs.already_published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "panther_lake-${{ steps.pick_tag.outputs.tag }}"
          name: "Panther Lake build — ${{ steps.pick_tag.outputs.tag }}"
          generate_release_notes: false
          body: |
            Custom Frigate build for Panther Lake NPU support, merging
            Kellen Renshaw's NPU driver PR (#24007) onto upstream
            ${{ steps.pick_tag.outputs.tag }}, with NPU driver/QSV/iHD
            version patches applied — see scripts/build.sh for exact
            versions baked in.

            Docker Hub: `bdelima/frigate-panther-lake:${{ env.VERSION }}`

      - name: Step summary
        if: always()
        run: |
          {
            echo "### Panther Lake Frigate build"
            echo "- Target tag: \`${{ steps.pick_tag.outputs.tag }}\`"
            if [[ "${{ steps.check_published.outputs.already_published }}" == "true" ]]; then
              echo "- Result: already published, skipped"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
